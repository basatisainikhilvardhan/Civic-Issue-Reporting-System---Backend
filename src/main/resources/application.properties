spring.application.name=Demo

# MySQL Database Configuration (Configurable via Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/demo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration (Configurable via Environment Variables)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Centralized CORS Configuration (Local & Vercel Production)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://civic-issue-reporting-system-frontend.vercel.app}


# Optional Google AI / Gemini API configuration
google.api.key=${GOOGLE_API_KEY:}
spring.ai.google.genai.model=gemini-3.6-flash

# File Upload Directory
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Server Port (Render dynamically assigns PORT)
server.port=${PORT:8080}
